
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>양정원의 iPhone</title>

<style>
:root {
  --blue:#007aff;
  --green:#34c759;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body {
  min-height:100vh;
  min-height:100dvh;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",sans-serif;
  display:grid;
  place-items:center;
  color:#000;
}

button,input {font:inherit;}
button {touch-action:manipulation;cursor:pointer;}

.phone-frame {
  width:min(412px,100vw);
  height:min(869px,100dvh);
  background:#000;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 50px rgba(0,0,0,.8);
}

@media(min-width:500px) {
  .phone-frame {
    border-radius:50px;
    border:10px solid #2d2d2d;
    height:min(840px,98dvh);
  }
}

.screen {
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:#000;
}

/* STATUS BAR */

.status-bar {
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:48px;
  padding:calc(10px + var(--safe-top)) 24px 0;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  font-size:13px;
  font-weight:650;
  z-index:100;
  pointer-events:none;
  color:#fff;
}

.status-left,.status-right {
  display:flex;
  align-items:center;
  gap:6px;
}

.notch {
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:30px;
  background:#000;
  border-radius:20px;
  z-index:101;
}

/* VIEWS */

.view {
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  z-index:10;
}

.view.active {display:flex;}

/* PASSCODE */

.pass-view {
  background:rgba(235,235,240,.98);
  padding:85px 25px calc(30px + var(--safe-bottom));
  text-align:center;
  color:#000;
  z-index:20;
}

.pass-title {
  font-size:21px;
  font-weight:600;
  margin-bottom:6px;
}

.pass-sub {
  font-size:13px;
  color:#666;
  margin-bottom:25px;
}

.pass-dots {
  display:flex;
  justify-content:center;
  gap:16px;
  margin-bottom:35px;
}

.pass-dot {
  width:13px;
  height:13px;
  border:1.5px solid #000;
  border-radius:50%;
}

.pass-dot.filled {background:#000;}

.keypad {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px 20px;
  max-width:280px;
  margin:0 auto;
}

.key-btn {
  width:72px;
  height:72px;
  border-radius:50%;
  background:#fff;
  border:0;
  font-size:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.key-btn:active {background:#d1d1d6;}

.key-sub {
  font-size:9px;
  font-weight:700;
  color:#888;
  margin-top:-3px;
}

.pass-error {
  height:18px;
  margin-top:15px;
  color:#d12b2b;
  font-size:12px;
}

/* HOME */

.home-view {
  background:linear-gradient(160deg,#1e293b 0%,#334155 50%,#475569 100%);
  padding:65px 20px calc(30px + var(--safe-bottom));
  justify-content:space-between;
}

.grid-apps {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px 12px;
}

.app-item {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  color:#fff;
  font-size:11px;
  font-weight:500;
  text-shadow:0 1px 3px rgba(0,0,0,.5);
  cursor:pointer;
}

.app-icon {
  width:60px;
  height:60px;
  border-radius:15px;
  overflow:visible;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  display:grid;
  place-items:center;
  position:relative;
}

.icon-kakao {background:#fee500;}
.icon-insta {
  background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285aeb 90%);
}
.icon-phone,.icon-msg {background:linear-gradient(180deg,#34c759,#28a745);}
.icon-photos {background:#fff;}
.icon-music {background:linear-gradient(180deg,#fa2d48,#fa233b);}

.badge {
  position:absolute;
  top:-5px;
  right:-5px;
  background:#ff3b30;
  color:#fff;
  font-size:11px;
  font-weight:700;
  padding:2px 6px;
  border-radius:10px;
  border:2px solid #fff;
}

.dock-bar {
  background:rgba(255,255,255,.35);
  backdrop-filter:blur(25px);
  border-radius:32px;
  padding:12px 10px;
  display:flex;
  justify-content:space-around;
  margin-bottom:2px;
}

/* APP VIEW */

.app-view {
  background:#fff;
  z-index:50;
}

.app-header {
  height:54px;
  flex:none;
  border-bottom:.5px solid #e5e5ea;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  padding:10px 12px 0;
  background:#f9f9fb;
}

.back-btn {
  justify-self:start;
  color:var(--blue);
  font-size:16px;
  font-weight:500;
  background:none;
  border:0;
  padding:8px 4px;
}

.app-title-text {
  font-weight:600;
  font-size:16px;
}

.header-right {
  justify-self:end;
  width:44px;
}

.app-body {
  flex:1;
  min-height:0;
  overflow-y:auto;
  background:#fff;
  overscroll-behavior:contain;
}

/* KAKAO */

.chat-list-row {
  display:flex;
  align-items:center;
  padding:14px 16px;
  border-bottom:.5px solid #f0f0f0;
  gap:12px;
  cursor:pointer;
}

.chat-pfp {
  width:50px;
  height:50px;
  border-radius:18px;
  background:#eee;
  display:grid;
  place-items:center;
  font-size:24px;
  flex:none;
}

.chat-info {flex:1;min-width:0;}
.chat-name {font-weight:700;font-size:15px;margin-bottom:4px;}
.chat-preview {
  font-size:13px;
  color:#8e8e93;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-time {font-size:11px;color:#8e8e93;}

.chatroom-container {
  height:100%;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#bacee0;
}

.chat-bubbles {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:16px 12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.bubble-msg {
  max-width:78%;
  padding:10px 14px;
  border-radius:16px;
  background:#fff;
  font-size:14px;
  line-height:1.4;
  align-self:flex-start;
  overflow-wrap:anywhere;
}

.bubble-msg.me {
  background:#fee500;
  align-self:flex-end;
}

.chat-input-bar {
  padding:10px;
  background:#fff;
  display:flex;
  gap:8px;
  align-items:center;
  border-top:.5px solid #ddd;
  padding-bottom:calc(10px + var(--safe-bottom));
}

.chat-input-bar input {
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:20px;
  padding:10px 14px;
  font-size:14px;
  outline:none;
}

.chat-input-bar button {
  background:#fee500;
  border:0;
  border-radius:16px;
  padding:9px 16px;
  font-weight:700;
  font-size:13px;
}

/* INSTAGRAM */

.insta-app {
  background:#fff;
  color:#262626;
  min-height:100%;
  font-family:Arial,sans-serif;
}

.insta-topbar {
  height:52px;
  padding:0 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:5;
}

.insta-logo {
  font-family:cursive;
  font-size:25px;
  font-weight:bold;
}

.insta-top-actions {
  display:flex;
  gap:20px;
  align-items:center;
}

.insta-action {
  border:0;
  background:none;
  font-size:24px;
  padding:0;
}

.insta-stories {
  display:flex;
  overflow-x:auto;
  gap:13px;
  padding:13px 12px;
  border-bottom:1px solid #eee;
  scrollbar-width:none;
}

.insta-stories::-webkit-scrollbar {display:none;}

.insta-story {
  flex:none;
  width:66px;
  text-align:center;
  font-size:11px;
  color:#333;
  cursor:pointer;
}

.insta-story-ring {
  width:62px;
  height:62px;
  border-radius:50%;
  padding:3px;
  margin:0 auto 5px;
  background:linear-gradient(45deg,#ffcc00,#ff3040,#c13584,#833ab4);
}

.insta-story-ring.seen {background:#c7c7c7;}

.insta-story-inner {
  width:100%;
  height:100%;
  border-radius:50%;
  border:2px solid white;
  display:grid;
  place-items:center;
  font-size:25px;
  background:#eee;
  overflow:hidden;
}

.insta-post {
  border-bottom:1px solid #eee;
  padding-bottom:13px;
  margin-bottom:5px;
}

.insta-post-head {
  display:flex;
  align-items:center;
  padding:11px 13px;
  gap:9px;
}

.insta-post-avatar {
  width:34px;
  height:34px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(45deg,#feda75,#d62976,#962fbf);
  color:white;
  font-size:19px;
}

.insta-post-user {
  flex:1;
  font-size:13px;
  font-weight:bold;
}

.insta-post-location {
  display:block;
  font-size:10px;
  font-weight:normal;
  color:#777;
  margin-top:2px;
}

.insta-post-more {
  border:0;
  background:none;
  font-size:22px;
}

.insta-post-image {
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#eee;
}

.insta-post-actions {
  display:flex;
  align-items:center;
  gap:15px;
  padding:10px 13px 5px;
}

.insta-post-actions button {
  border:0;
  background:none;
  font-size:24px;
  padding:0;
}

.insta-post-actions .save {margin-left:auto;}

.insta-post-caption {
  padding:0 13px;
  font-size:13px;
  line-height:1.5;
}

.insta-likes {font-weight:bold;margin-bottom:4px;}

.insta-ad-label {
  display:block;
  font-size:10px;
  color:#888;
  margin-top:3px;
  font-weight:normal;
}

.insta-ad-button {
  margin:10px 13px 0;
  width:calc(100% - 26px);
  padding:10px;
  border:0;
  border-radius:5px;
  background:#0095f6;
  color:white;
  font-weight:bold;
}

.insta-bottom-nav {
  height:50px;
  border-top:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-around;
  position:sticky;
  bottom:0;
  background:#fff;
}

.insta-bottom-nav button {
  border:0;
  background:none;
  font-size:23px;
}

/* INSTAGRAM DM LIST */

.insta-dm-header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 15px;
  border-bottom:1px solid #eee;
}

.insta-dm-header strong {font-size:17px;}

.insta-dm-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 15px;
  cursor:pointer;
}

.insta-dm-avatar {
  width:55px;
  height:55px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#eee;
  font-size:25px;
  flex:none;
}

.insta-dm-info {flex:1;min-width:0;}
.insta-dm-name {font-size:14px;font-weight:600;margin-bottom:5px;}

.insta-dm-preview {
  font-size:12px;
  color:#888;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.insta-dm-time {font-size:11px;color:#999;}

/* INSTAGRAM DM ROOM */

.insta-dm-room {
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
}

.insta-dm-person {
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 13px;
  border-bottom:1px solid #eee;
}

.insta-dm-person button {
  border:0;
  background:none;
  font-size:22px;
}

.insta-dm-person-avatar {
  width:38px;
  height:38px;
  border-radius:50%;
  background:#eee;
  display:grid;
  place-items:center;
}

.insta-dm-person-info {font-size:13px;font-weight:bold;}

.insta-dm-person-info small {
  display:block;
  color:#888;
  font-weight:normal;
  margin-top:3px;
}

.insta-dm-messages {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:15px 12px;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.insta-dm-bubble {
  max-width:78%;
  padding:10px 14px;
  border-radius:20px;
  background:#efefef;
  font-size:13px;
  line-height:1.45;
  align-self:flex-start;
  overflow-wrap:anywhere;
}

.insta-dm-bubble.me {
  background:#3797f0;
  color:white;
  align-self:flex-end;
}

.insta-dm-inputbar {
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:25px;
  margin:8px;
  margin-bottom:calc(8px + var(--safe-bottom));
}

.insta-dm-inputbar input {
  border:0;
  outline:none;
  flex:1;
  min-width:0;
  font-size:14px;
  background:transparent;
}

.insta-dm-inputbar button {
  border:0;
  background:none;
  color:#0095f6;
  font-weight:bold;
}

/* PROFILE */

.insta-profile-header {padding:17px 15px;}

.insta-profile-stats {
  display:flex;
  justify-content:space-around;
  text-align:center;
  flex:1;
}

.insta-profile-stats b {display:block;font-size:16px;}
.insta-profile-stats span {font-size:12px;}

.insta-empty-posts {
  text-align:center;
  padding:65px 15px;
  color:#888;
}

/* CALLS */

.call-log-item {
  padding:14px 16px;
  border-bottom:.5px solid #e5e5ea;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.call-name {font-weight:600;font-size:15px;}
.call-type {font-size:12px;color:#8e8e93;margin-top:2px;}
.call-status {font-size:12px;color:#8e8e93;}
.text-red {color:#ff3b30!important;}

/* MESSAGES */

.message-note {
  padding:10px 16px;
  background:#f7f7f7;
  color:#888;
  font-size:12px;
  text-align:center;
}

/* HOME INDICATOR */

.home-indicator {
  position:absolute;
  bottom:calc(8px + var(--safe-bottom));
  left:50%;
  transform:translateX(-50%);
  width:134px;
  height:5px;
  background:#fff;
  border-radius:10px;
  z-index:200;
  mix-blend-mode:difference;
  cursor:pointer;
}

@media(max-height:650px) {
  .pass-view {padding-top:65px;}
  .pass-dots {margin-bottom:20px;}
  .keypad {gap:9px 16px;}
  .key-btn {width:60px;height:60px;}
  .home-view {padding-top:55px;}
  .grid-apps {gap:14px 10px;}
}
</style>
</head>

<body>
<div class="phone-frame">
<div class="screen">

<!-- STATUS BAR -->

<div class="status-bar" id="statusBar">
  <div class="status-left">
    <span>KT</span>
    <span>5G</span>
  </div>
  <div class="notch"></div>
  <div class="status-right">
    <span id="liveTime">09:41</span>
    <span>🔋</span>
  </div>
</div>

<!-- PASSCODE -->

<div class="view pass-view active" id="passView">

  <div class="pass-title">양정원님의 iPhone</div>
  <div class="pass-sub">암호 입력 (0209)</div>

  <div class="pass-dots">
    <div class="pass-dot" id="dot0"></div>
    <div class="pass-dot" id="dot1"></div>
    <div class="pass-dot" id="dot2"></div>
    <div class="pass-dot" id="dot3"></div>
  </div>

  <div class="keypad">
    <button class="key-btn" onclick="pressKey('1')">1<span class="key-sub">&nbsp;</span></button>
    <button class="key-btn" onclick="pressKey('2')">2<span class="key-sub">ABC</span></button>
    <button class="key-btn" onclick="pressKey('3')">3<span class="key-sub">DEF</span></button>
    <button class="key-btn" onclick="pressKey('4')">4<span class="key-sub">GHI</span></button>
    <button class="key-btn" onclick="pressKey('5')">5<span class="key-sub">JKL</span></button>
    <button class="key-btn" onclick="pressKey('6')">6<span class="key-sub">MNO</span></button>
    <button class="key-btn" onclick="pressKey('7')">7<span class="key-sub">PQRS</span></button>
    <button class="key-btn" onclick="pressKey('8')">8<span class="key-sub">TUV</span></button>
    <button class="key-btn" onclick="pressKey('9')">9<span class="key-sub">WXYZ</span></button>
    <button class="key-btn" style="visibility:hidden"></button>
    <button class="key-btn" onclick="pressKey('0')">0<span class="key-sub">+</span></button>
    <button class="key-btn" style="font-size:14px" onclick="clearPass()">지우기</button>
  </div>

  <div class="pass-error" id="passError"></div>
</div>

<!-- HOME -->

<div class="view home-view" id="homeView">

  <div class="grid-apps">

    <div class="app-item" onclick="openApp('kakao')">
      <div class="app-icon icon-kakao">
        <svg width="38" height="38" viewBox="0 0 100 100">
          <path d="M50 15C27.9 15 10 28.4 10 45c0 10.7 7.4 20.1 18.6 25.5l-4.7 17.2c-.3 1.1.9 2 1.8 1.4l20.2-13.4c1.3.1 2.7.2 4.1.2 22.1 0 40-13.4 40-30S72.1 15 50 15z" fill="#3c1e1e"/>
          <text x="50" y="52" font-size="20" font-weight="900" fill="#fee500" text-anchor="middle">TALK</text>
        </svg>
        <span class="badge">2</span>
      </div>
      카카오톡
    </div>

    <div class="app-item" onclick="openApp('insta')">
      <div class="app-icon icon-insta">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5"/>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
        </svg>
      </div>
      Instagram
    </div>

    <div class="app-item" onclick="showNotice('사진첩 앱입니다.')">
      <div class="app-icon icon-photos">
        <svg width="32" height="32" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="8" fill="#ff2d55" opacity=".8"/>
          <circle cx="12" cy="8" r="5" fill="#ff9500" opacity=".8"/>
          <circle cx="16" cy="12" r="5" fill="#4cd964" opacity=".8"/>
        </svg>
      </div>
      사진
    </div>

    <div class="app-item" onclick="showNotice('음악 플레이어입니다.')">
      <div class="app-icon icon-music">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
      </div>
      음악
    </div>

  </div>

  <div class="dock-bar">

    <div class="app-item" onclick="openApp('calls')">
      <div class="app-icon icon-phone" style="width:54px;height:54px">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#fff">
          <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
        </svg>
      </div>
    </div>

    <div class="app-item" onclick="openApp('kakao')">
      <div class="app-icon icon-kakao" style="width:54px;height:54px">
        <svg width="34" height="34" viewBox="0 0 100 100">

  document.getElementById('statusBar').style.color =
    viewId === 'homeView' ? '#fff' : '#000';

  document.getElementById('homeIndicator').style.display =
    viewId === 'passView' ? 'none' : 'block';

    name === '박종성' ? jongseongChat :

          <div class="bubble-msg">우리 헤어져.</div>
          <div class="bubble-msg me">여주야 잠시만 내 말 좀 들어줘</div>

      </div>

    return;

  const bubbles = data.map(c => `
    <div class="bubble-msg ${c.sender === '나' ? 'me' : ''}">
      ${escapeHTML(c.text)}

  `).join('');

}

  if (box) box.scrollTop = box.scrollHeight;
}

function addKakaoReply(name,message,delay=700) {
  const timer = setTimeout(() => {
    const data = name === '박종성' ? jongseongChat : sunwooChat;

    data.push({
      sender:name,
      text:message
    });

    if (currentApp === 'kakao' && currentChat === name) {
      openChatRoom(name);
    }
  },delay);

  replyTimers.push(timer);
}

/* KAKAO SEND */

function sendChatMsg(name) {
  const input = document.getElementById('chatInput');
  if (!input) return;

  const val = input.value.trim();
  if (!val) return;

  const data =
    name === '박종성' ? jongseongChat :
    name === '김선우' ? sunwooChat : null;

  if (!data) return;

  data.push({
    sender:'나',
    text:val
  });

  openChatRoom(name);

  if (name === '박종성' && val.includes('싸웠어요')) {
    addKakaoReply(
      '박종성',
      '아 그렇지?ㅋㅋㅋ 싸우지 마라',
      500
    );
  }
}

      currentApp === 'insta' &&
      instaCurrentScreen === 'dmChat'

  replyTimers.push(timer);
}

/* SEND INSTAGRAM DM */

function sendInstaDM() {
  const input = document.getElementById('instaDMInput');
  if (!input) return;

  const message = input.value.trim();
  if (!message) return;

  instaSunwooDM.push({
    sender:'나',
    text:message
  });

  openInstaDM('김선우');

  const normalized = message.replace(/\s+/g,'');

  /* 여주 누나 위치 질문 */

  if (normalized.includes('여주누나어딨어요')) {
    addInstaDMReply(
      '걔 지금 성훈이 형이랑 같이 공부하던데? 너네 헤어졌어?',
      700
    );

  /* 아니요 싸웠어요 답변 */

  else if (normalized.includes('아니요싸웠어요')) {
    addInstaDMReply(
      '화해해라 얼른ㅠ',
      700
    );
  }
}

/* BACK BUTTON */

function handleBack() {

  if (currentApp === 'insta') {

    if (instaCurrentScreen === 'dmChat') {
      openInstaDMList();
      return;
    }

    if (
      instaCurrentScreen === 'dmList' ||
      instaCurrentScreen === 'profile'
    ) {
      renderInstagram();
      return;
    }
  }

  if (currentApp === 'kakao' && currentChat) {
    currentChat = '';
    setHeader('카카오톡');
    renderKakaoList();
    return;
  }

  goHome();
}

/* ESCAPE HTML */

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

/* HOME INDICATOR */

document.getElementById('homeIndicator').onclick = goHome;
